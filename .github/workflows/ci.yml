name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      continue-on-error: true

    - name: Run Tests
      run: npx vitest run

    - name: Build Project
      run: npm run build

    - name: Deploy
      # Deployment steps would go here depending on the provider (Vercel, AWS S3, etc.)
      run: echo "Deployment would execute here."
